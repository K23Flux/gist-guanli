# Example only. No service is deployed by adding this file.
services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4387:4387"
    volumes:
      - gateway-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  gateway-data:
